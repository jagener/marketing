td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
.kw{font-weight:600}.tag{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px}
.rel-간접{color:var(--mut)}tr:hover td{background:var(--hi)}
.note{color:var(--mut);font-size:12px;margin-top:12px}
